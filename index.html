<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories of the Collapsed Machine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        svg {
            filter: drop-shadow(0 0 20px rgba(100, 200, 255, 0.3));
            user-select: none;
        }

        @keyframes spin {
            from {
                transform: rotateZ(0deg) rotateX(20deg) rotateY(0deg);
            }
            to {
                transform: rotateZ(360deg) rotateX(20deg) rotateY(360deg);
            }
        }

        .form {
            animation: spin 20s linear infinite;
            transform-origin: center;
            transform-style: preserve-3d;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <svg id="form" class="form" viewBox="0 0 200 200" width="300" height="300" xmlns="http://www.w3.org/2000/svg">
            <!-- Sphere (initial) -->
            <defs>
                <radialGradient id="gradient">
                    <stop offset="0%" style="stop-color:#64c8ff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
                </radialGradient>
            </defs>
            <circle class="shape" cx="100" cy="100" r="95" fill="url(#gradient)" />
        </svg>
    </div>

    <script>
        const forms = [
            // Sphere
            {
                svg: `<circle class="shape" cx="100" cy="100" r="95" fill="url(#gradient)" />`
            },
            // Cube
            {
                svg: `
                    <g class="shape">
                        <!-- Front face -->
                        <polygon points="50,50 150,50 150,150 50,150" fill="#4a90e2" stroke="#64c8ff" stroke-width="2"/>
                        <!-- Top face -->
                        <polygon points="50,50 80,25 180,25 150,50" fill="#64c8ff" stroke="#64c8ff" stroke-width="2"/>
                        <!-- Right face -->
                        <polygon points="150,50 180,25 180,125 150,150" fill="#2d5aa8" stroke="#64c8ff" stroke-width="2"/>
                    </g>
                `
            },
            // Tetrahedron (Pyramid)
            {
                svg: `
                    <g class="shape">
                        <!-- Base -->
                        <polygon points="50,140 150,140 100,180" fill="#4a90e2" stroke="#64c8ff" stroke-width="2"/>
                        <!-- Left face -->
                        <polygon points="50,140 100,30 100,180" fill="#64c8ff" stroke="#64c8ff" stroke-width="2"/>
                        <!-- Right face -->
                        <polygon points="150,140 100,30 100,180" fill="#2d5aa8" stroke="#64c8ff" stroke-width="2"/>
                        <!-- Back face (partial) -->
                        <polygon points="50,140 150,140 100,30" fill="#1e3a8a" stroke="#64c8ff" stroke-width="2"/>
                    </g>
                `
            },
            // Octahedron
            {
                svg: `
                    <g class="shape">
                        <!-- Top pyramid -->
                        <polygon points="100,30 50,80 100,70 150,80" fill="#64c8ff" stroke="#64c8ff" stroke-width="2"/>
                        <!-- Middle square -->
                        <polygon points="50,80 100,70 150,80 100,90" fill="#4a90e2" stroke="#64c8ff" stroke-width="2"/>
                        <!-- Bottom pyramid -->
                        <polygon points="100,130 50,80 100,90 150,80" fill="#2d5aa8" stroke="#64c8ff" stroke-width="2"/>
                        <!-- Front faces -->
                        <polygon points="50,80 100,70 100,130" fill="#1e3a8a" stroke="#64c8ff" stroke-width="2"/>
                        <polygon points="150,80 100,70 100,130" fill="#0f1e4d" stroke="#64c8ff" stroke-width="2"/>
                    </g>
                `
            },
            // Icosahedron (simplified)
            {
                svg: `
                    <g class="shape">
                        <polygon points="100,30 60,60 70,110 130,110 140,60" fill="#64c8ff" stroke="#64c8ff" stroke-width="1.5"/>
                        <polygon points="60,60 30,80 50,130 70,110" fill="#4a90e2" stroke="#64c8ff" stroke-width="1.5"/>
                        <polygon points="140,60 170,80 150,130 130,110" fill="#2d5aa8" stroke="#64c8ff" stroke-width="1.5"/>
                        <polygon points="70,110 50,130 100,160 130,110" fill="#1e3a8a" stroke="#64c8ff" stroke-width="1.5"/>
                        <polygon points="30,80 50,130 70,110 60,60" fill="#0f1e4d" stroke="#64c8ff" stroke-width="1.5"/>
                        <polygon points="170,80 150,130 130,110 140,60" fill="#0a0f2e" stroke="#64c8ff" stroke-width="1.5"/>
                    </g>
                `
            },
            // Dodecahedron (simplified)
            {
                svg: `
                    <g class="shape">
                        <polygon points="100,40 60,60 55,100 85,120 130,115 145,80" fill="#64c8ff" stroke="#64c8ff" stroke-width="1.5"/>
                        <polygon points="60,60 30,90 40,130 70,140 85,120" fill="#4a90e2" stroke="#64c8ff" stroke-width="1.5"/>
                        <polygon points="145,80 170,90 160,130 130,140 130,115" fill="#2d5aa8" stroke="#64c8ff" stroke-width="1.5"/>
                        <polygon points="55,100 40,130 70,140 85,120" fill="#1e3a8a" stroke="#64c8ff" stroke-width="1.5"/>
                        <polygon points="130,115 130,140 100,160 85,145" fill="#0f1e4d" stroke="#64c8ff" stroke-width="1.5"/>
                    </g>
                `
            }
        ];

        let currentForm = 0;
        const formSvg = document.getElementById('form');
        const container = document.getElementById('container');

        container.addEventListener('click', () => {
            currentForm = (currentForm + 1) % forms.length;
            const defs = '<defs><radialGradient id="gradient"><stop offset="0%" style="stop-color:#64c8ff;stop-opacity:1" /><stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" /></radialGradient></defs>';
            formSvg.innerHTML = defs + forms[currentForm].svg;
        });
    </script>
</body>
</html>
