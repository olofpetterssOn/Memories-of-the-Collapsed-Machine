<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories of the Collapsed Machine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        canvas {
            display: block;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // Material
        const material = new THREE.MeshPhongMaterial({
            color: 0xff6600,
            shininess: 100,
            wireframe: false
        });

        let currentShape = 0;
        let mesh = null;

        const shapes = [
            // Sphere
            () => new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), material),
            // Cube
            () => new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), material),
            // Tetrahedron
            () => new THREE.Mesh(new THREE.TetrahedronGeometry(1, 0), material),
            // Octahedron
            () => new THREE.Mesh(new THREE.OctahedronGeometry(1, 0), material),
            // Icosahedron
            () => new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), material),
            // Dodecahedron
            () => new THREE.Mesh(new THREE.DodecahedronGeometry(1, 0), material)
        ];

        // Create initial mesh
        mesh = shapes[currentShape]();
        scene.add(mesh);

        // Mouse interaction
        canvas.addEventListener('click', () => {
            scene.remove(mesh);
            currentShape = (currentShape + 1) % shapes.length;
            mesh = shapes[currentShape]();
            scene.add(mesh);
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            if (mesh) {
                mesh.rotation.x += 0.005;
                mesh.rotation.y += 0.008;
                mesh.rotation.z += 0.003;
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
