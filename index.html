<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories of the Collapsed Machine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        svg {
            filter: drop-shadow(0 8px 32px rgba(255, 102, 0, 0.15));
            user-select: none;
        }

        @keyframes spin {
            from {
                transform: rotateZ(0deg) rotateX(25deg) rotateY(0deg);
            }
            to {
                transform: rotateZ(360deg) rotateX(25deg) rotateY(360deg);
            }
        }

        .form {
            animation: spin 24s linear infinite;
            transform-origin: center;
            transform-style: preserve-3d;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <svg id="form" class="form" viewBox="0 0 200 200" width="320" height="320" xmlns="http://www.w3.org/2000/svg">
            <!-- Sphere (initial) -->
            <defs>
                <radialGradient id="gradient" cx="35%" cy="35%">
                    <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:1" />
                    <stop offset="60%" style="stop-color:#e67e22;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#cc5500;stop-opacity:1" />
                </radialGradient>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            <circle class="shape" cx="100" cy="100" r="95" fill="url(#gradient)" filter="url(#glow)" />
        </svg>
    </div>

    <script>
        const forms = [
            // Sphere
            {
                svg: `<circle class="shape" cx="100" cy="100" r="95" fill="url(#gradient)" filter="url(#glow)" />`
            },
            // Cube - clean minimalist
            {
                svg: `
                    <g class="shape">
                        <polygon points="45,50 155,50 155,160 45,160" fill="#e67e22" filter="url(#glow)"/>
                        <polygon points="45,50 75,30 185,30 155,50" fill="#ff8c42" filter="url(#glow)"/>
                        <polygon points="155,50 185,30 185,140 155,160" fill="#cc5500" filter="url(#glow)"/>
                        <line x1="45" y1="50" x2="155" y2="50" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
                        <line x1="155" y1="50" x2="185" y2="30" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
                    </g>
                `
            },
            // Tetrahedron - sharp geometric
            {
                svg: `
                    <g class="shape">
                        <polygon points="100,35 50,155 150,155" fill="#e67e22" filter="url(#glow)"/>
                        <polygon points="100,35 75,115 125,115" fill="#ff8c42" filter="url(#glow)"/>
                        <polygon points="50,155 75,115 125,115" fill="#cc5500" filter="url(#glow)"/>
                        <polygon points="150,155 75,115 125,115" fill="#994400" filter="url(#glow)"/>
                    </g>
                `
            },
            // Octahedron - contemporary wireframe style
            {
                svg: `
                    <g class="shape">
                        <polygon points="100,30 65,70 100,85 135,70" fill="#ff8c42" filter="url(#glow)" opacity="0.9"/>
                        <polygon points="100,30 65,70 60,130 100,145" fill="#e67e22" filter="url(#glow)" opacity="0.9"/>
                        <polygon points="100,30 135,70 140,130 100,145" fill="#e67e22" filter="url(#glow)" opacity="0.9"/>
                        <polygon points="65,70 100,85 60,130 100,145" fill="#cc5500" filter="url(#glow)" opacity="0.9"/>
                        <polygon points="135,70 100,85 140,130 100,145" fill="#cc5500" filter="url(#glow)" opacity="0.9"/>
                        <polygon points="65,70 135,70 140,130 60,130" fill="#994400" filter="url(#glow)" opacity="0.85"/>
                        <line x1="100" y1="30" x2="100" y2="145" stroke="#ff8c42" stroke-width="0.5" opacity="0.4"/>
                        <line x1="65" y1="70" x2="135" y2="70" stroke="#ff8c42" stroke-width="0.5" opacity="0.4"/>
                    </g>
                `
            },
            // Icosahedron - complex contemporary
            {
                svg: `
                    <g class="shape">
                        <polygon points="100,25 70,50 75,90 125,90 130,50" fill="#ff8c42" filter="url(#glow)" opacity="0.85"/>
                        <polygon points="70,50 45,75 65,120 90,100 75,90" fill="#e67e22" filter="url(#glow)" opacity="0.85"/>
                        <polygon points="130,50 155,75 135,120 110,100 125,90" fill="#e67e22" filter="url(#glow)" opacity="0.85"/>
                        <polygon points="75,90 90,100 65,120 55,110" fill="#cc5500" filter="url(#glow)" opacity="0.85"/>
                        <polygon points="125,90 110,100 135,120 145,110" fill="#cc5500" filter="url(#glow)" opacity="0.85"/>
                        <polygon points="65,120 90,100 110,100 135,120 100,150" fill="#994400" filter="url(#glow)" opacity="0.85"/>
                        <line x1="70" y1="50" x2="130" y2="50" stroke="#ffffff" stroke-width="0.3" opacity="0.2"/>
                        <line x1="100" y1="25" x2="100" y2="150" stroke="#ffffff" stroke-width="0.3" opacity="0.2"/>
                    </g>
                `
            },
            // Dodecahedron - organic contemporary
            {
                svg: `
                    <g class="shape">
                        <polygon points="100,35 75,55 65,85 85,100 120,95 135,70" fill="#ff8c42" filter="url(#glow)" opacity="0.87"/>
                        <polygon points="75,55 50,70 50,110 65,85" fill="#e67e22" filter="url(#glow)" opacity="0.87"/>
                        <polygon points="135,70 160,70 160,110 150,85" fill="#e67e22" filter="url(#glow)" opacity="0.87"/>
                        <polygon points="65,85 50,110 80,135 100,130 95,105" fill="#cc5500" filter="url(#glow)" opacity="0.87"/>
                        <polygon points="150,85 160,110 120,135 100,130 105,105" fill="#cc5500" filter="url(#glow)" opacity="0.87"/>
                        <polygon points="85,100 95,105 100,130 80,145 70,135" fill="#994400" filter="url(#glow)" opacity="0.87"/>
                        <polygon points="120,95 105,105 100,130 120,145 130,135" fill="#994400" filter="url(#glow)" opacity="0.87"/>
                        <polygon points="70,135 80,145 100,155 120,145 130,135" fill="#773300" filter="url(#glow)" opacity="0.85"/>
                        <line x1="100" y1="35" x2="100" y2="155" stroke="#ffffff" stroke-width="0.3" opacity="0.15"/>
                    </g>
                `
            }
        ];

        let currentForm = 0;
        const formSvg = document.getElementById('form');
        const container = document.getElementById('container');

        container.addEventListener('click', () => {
            currentForm = (currentForm + 1) % forms.length;
            const defs = `<defs>
                <radialGradient id="gradient" cx="35%" cy="35%">
                    <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:1" />
                    <stop offset="60%" style="stop-color:#e67e22;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#cc5500;stop-opacity:1" />
                </radialGradient>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>`;
            formSvg.innerHTML = defs + forms[currentForm].svg;
        });
    </script>
</body>
</html>
